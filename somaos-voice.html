<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SomaOS Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --glass-bg: rgba(18, 18, 22, 0.55);
    --glass-hover: rgba(25, 25, 30, 0.68);
    --text: #ffffff;
    --text-muted: rgba(255,255,255,0.38);
    --text-dim: rgba(255,255,255,0.18);
    --green: #52c97a;
    --green-dim: rgba(82, 201, 122, 0.12);
    --green-dim2: rgba(82, 201, 122, 0.06);
    --ampel-rot: #f55252;
    --radius: 18px;
    --blur: blur(28px) saturate(160%);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080808;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% -5%, rgba(82,201,122,0.09) 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 95% 95%, rgba(82,201,122,0.04) 0%, transparent 60%),
      #080808;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 18px 80px;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-radius: var(--radius);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 0 24px;
  }

  .logo { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
  .logo span { color: var(--green); }

  .date-pill {
    background: var(--glass-bg);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border-radius: 50px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.4px;
  }

  .stack { display: flex; flex-direction: column; gap: 10px; }

  .card { padding: 20px; }

  .card-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .module-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .module-btn {
    background: rgba(255,255,255,0.05);
    border: none;
    border-radius: 12px;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3px;
    padding: 12px 4px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .module-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .module-btn.active { background: var(--green-dim); color: var(--green); }
  .module-icon { font-size: 18px; display: block; margin-bottom: 5px; }

  .record-card {
    padding: 36px 20px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .waveform.visible { opacity: 1; }
  .wave-bar {
    width: 3px;
    background: var(--green);
    border-radius: 2px;
    animation: wave 0.9s ease-in-out infinite;
    height: 4px;
    opacity: 0.8;
  }
  .wave-bar:nth-child(1) { animation-delay: 0s; }
  .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { animation-delay: 0.4s; }
  .wave-bar:nth-child(6) { animation-delay: 0.3s; }
  .wave-bar:nth-child(7) { animation-delay: 0.2s; }
  .wave-bar:nth-child(8) { animation-delay: 0.1s; }

  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 18px; }
  }

  .record-btn {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    outline: none;
  }

  .record-btn:hover { background: rgba(255,255,255,0.1); }
  .record-btn.recording {
    background: rgba(82, 201, 122, 0.14);
    animation: pulse-rec 1.5s infinite;
  }

  @keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(82,201,122,0.2); }
    50% { box-shadow: 0 0 0 16px rgba(82,201,122,0); }
  }

  .record-btn svg { width: 28px; height: 28px; color: var(--text-muted); transition: color 0.3s; }
  .record-btn.recording svg { color: var(--green); }
  .record-btn:hover svg { color: var(--text); }

  .record-label { font-size: 12px; font-weight: 400; color: var(--text-muted); }
  .record-label.active { color: var(--green); }

  .transcript-card { display: none; padding: 20px; }
  .transcript-card.visible { display: block; }

  .transcript-text { font-size: 13px; font-weight: 300; line-height: 1.65; color: rgba(255,255,255,0.65); }

  .manual-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    color: var(--text);
    outline: none;
    resize: none;
    min-height: 72px;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 10px;
    display: block;
  }
  .manual-input:focus { border-color: rgba(82,201,122,0.4); background: rgba(255,255,255,0.08); }
  .manual-input::placeholder { color: var(--text-muted); }

  .btn-analyze {
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.07);
    color: var(--text);
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 12px;
    cursor: pointer;
    border-radius: 10px;
    transition: background 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-analyze:hover { background: rgba(255,255,255,0.12); }

  .preview-card { display: none; padding: 20px; }
  .preview-card.visible { display: block; }

  .preview-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .preview-row:last-child { border-bottom: none; padding-bottom: 0; }
  .preview-row:first-child { padding-top: 0; }

  .preview-key { font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.3px; text-transform: uppercase; }
  .preview-val { font-size: 13px; font-weight: 400; }

  .status-card { display: none; padding: 16px 20px; text-align: center; font-size: 12px; font-weight: 400; letter-spacing: 0.3px; }
  .status-card.visible { display: block; }
  .status-card.success { color: var(--green); }
  .status-card.error { color: var(--ampel-rot); }
  .status-card.loading { color: var(--text-muted); }

  .actions-card { display: none; padding: 16px 20px; gap: 8px; flex-direction: column; }
  .actions-card.visible { display: flex; }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--green);
    color: #080808;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    border-radius: 12px;
    transition: opacity 0.2s;
    letter-spacing: 0.2px;
  }
  .btn-submit:hover { opacity: 0.88; }

  .btn-cancel {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: var(--text-muted);
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 13px;
    cursor: pointer;
    border-radius: 12px;
    transition: color 0.2s;
  }
  .btn-cancel:hover { color: var(--text); }

  .history-card { padding: 20px; }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .history-item:last-child { border-bottom: none; padding-bottom: 0; }
  .history-item:first-child { padding-top: 0; }

  .history-left { display: flex; flex-direction: column; gap: 3px; }
  .history-module { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; }
  .history-summary { font-size: 13px; font-weight: 300; }
  .history-time { font-size: 11px; color: var(--text-muted); }
  .dot-success { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; margin-left: 10px; }

  .empty { font-size: 12px; font-weight: 300; color: var(--text-muted); }

  .spinner {
    width: 14px; height: 14px;
    border: 1.5px solid rgba(255,255,255,0.12);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">
  <div class="header">
    <div class="logo"><span>Soma</span>OS</div>
    <div class="date-pill" id="dateBadge"></div>
  </div>

  <div class="stack">

    <div class="glass card">
      <div class="card-label">Modul</div>
      <div class="module-grid">
        <button class="module-btn active" data-module="schlaf" onclick="selectModule(this)">
          <span class="module-icon">🌙</span>Schlaf
        </button>
        <button class="module-btn" data-module="fitness" onclick="selectModule(this)">
          <span class="module-icon">💪</span>Fitness
        </button>
        <button class="module-btn" data-module="ernaehrung" onclick="selectModule(this)">
          <span class="module-icon">🥗</span>Ernährung
        </button>
        <button class="module-btn" data-module="mindfulness" onclick="selectModule(this)">
          <span class="module-icon">🧘</span>Psyche
        </button>
      </div>
    </div>

    <div class="glass record-card">
      <div class="waveform" id="waveform">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="record-label" id="recordLabel">Tippen zum Aufnehmen</div>
    </div>

    <div class="glass transcript-card" id="transcriptCard">
      <div class="card-label">Transkript</div>
      <div class="transcript-text" id="transcriptText"></div>
    </div>

    <div class="glass preview-card" id="previewCard">
      <div class="card-label">Erkannter Eintrag</div>
      <div id="previewRows"></div>
    </div>

    <div class="glass status-card" id="statusCard"></div>

    <div class="glass actions-card" id="actionsCard">
      <button class="btn-submit" onclick="saveToNotion()">In Notion speichern</button>
      <button class="btn-cancel" onclick="resetAll()">Verwerfen</button>
    </div>

    <div class="glass history-card">
      <div class="card-label">Heutige Einträge</div>
      <div id="historyList"><div class="empty">Noch keine Einträge</div></div>
    </div>

  </div>
</div>

<script>
const NOTION_TOKEN = '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';
const BACKEND_DB_ID = '30cdded55d218032bf27000beae7ca6c';

let currentModule = 'schlaf';
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let parsedEntry = null;
let sessionHistory = [];

document.getElementById('dateBadge').textContent = new Date().toLocaleDateString('de-DE', {weekday:'short', day:'numeric', month:'short'});

function selectModule(btn) {
  document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentModule = btn.dataset.module;
  resetAll();
}

async function toggleRecord() {
  if (!isRecording) await startRecording();
  else stopRecording();
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = processAudio;
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('recordBtn').classList.add('recording');
    document.getElementById('recordLabel').textContent = 'Aufnahme läuft — tippen zum Stoppen';
    document.getElementById('recordLabel').classList.add('active');
    document.getElementById('waveform').classList.add('visible');
  } catch(e) {
    showStatus('Mikrofon-Zugriff verweigert', 'error');
  }
}

function stopRecording() {
  if (mediaRecorder) { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); }
  isRecording = false;
  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('recordLabel').textContent = 'Wird verarbeitet…';
  document.getElementById('recordLabel').classList.remove('active');
  document.getElementById('waveform').classList.remove('visible');
}

async function processAudio() {
  showStatus('<span class="spinner"></span>Transkribiere…', 'loading');
  const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
  const reader = new FileReader();
  reader.readAsDataURL(audioBlob);
  reader.onloadend = async () => {
    await parseWithClaude(reader.result.split(',')[1]);
  };
}

const MODULE_PROMPTS = {
  schlaf: `Du bist Assistent für SomaOS. Transkribiere die Audioaufnahme und extrahiere Schlafdaten.
Felder: einschlafzeit (HH:MM), aufwachzeit (HH:MM), schlaf_quality (1-10), regularity (eines von: "0-1h Abweichung","1-2h Abweichung","2-3h Abweichung","3h+ Abweichung"), notiz.
Antworte NUR mit JSON ohne Markdown:
{"transkript":"","einschlafzeit":"23:30","aufwachzeit":"07:00","schlaf_quality":7,"regularity":"0-1h Abweichung","notiz":""}`,

  fitness: `Du bist Assistent für SomaOS. Transkribiere und extrahiere Fitness-Daten.
Felder: workout_typ, dauer_min, intensitaet (1-10), uebungen, notiz.
Antworte NUR mit JSON ohne Markdown:
{"transkript":"","workout_typ":"Upper Body","dauer_min":60,"intensitaet":7,"uebungen":"Bench, Rows","notiz":""}`,

  ernaehrung: `Du bist Assistent für SomaOS. Transkribiere und extrahiere Ernährungsdaten.
Felder: kalorien, protein_g, wasser_ml, mahlzeiten, notiz.
Antworte NUR mit JSON ohne Markdown:
{"transkript":"","kalorien":2800,"protein_g":180,"wasser_ml":2500,"mahlzeiten":"Oats, Chicken, Rice","notiz":""}`,

  mindfulness: `Du bist Assistent für SomaOS. Transkribiere und extrahiere Psyche-Daten.
Felder: stimmung (1-10), energie (1-10), stress (1-10), bildschirmzeit_h, journaling (true/false), notiz.
Antworte NUR mit JSON ohne Markdown:
{"transkript":"","stimmung":7,"energie":7,"stress":3,"bildschirmzeit_h":3,"journaling":false,"notiz":""}`
};

async function parseWithClaude(base64Audio) {
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: MODULE_PROMPTS[currentModule] },
            { type: 'document', source: { type: 'base64', media_type: 'audio/webm', data: base64Audio } }
          ]
        }]
      })
    });
    if (!response.ok) { showTextFallback(); return; }
    const data = await response.json();
    const text = data.content.map(i => i.text || '').join('');
    try {
      parsedEntry = JSON.parse(text.replace(/```json|```/g, '').trim());
      showParsedEntry();
    } catch(e) { showTextFallback(); }
  } catch(e) { showTextFallback(); }
}

function showTextFallback() {
  hideStatus();
  document.getElementById('transcriptCard').classList.add('visible');
  document.getElementById('transcriptText').innerHTML = `
    <textarea class="manual-input" id="manualInput" placeholder="Tippe deinen Eintrag — z.B.: Heute um 23:30 eingeschlafen, 7:15 aufgewacht, Qualität 7…"></textarea>
    <button class="btn-analyze" onclick="parseTextInput()">Analysieren →</button>
  `;
  document.getElementById('recordLabel').textContent = 'Tippen zum Aufnehmen';
}

async function parseTextInput() {
  const text = document.getElementById('manualInput')?.value;
  if (!text?.trim()) return;
  showStatus('<span class="spinner"></span>Analysiere…', 'loading');
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        messages: [{ role: 'user', content: MODULE_PROMPTS[currentModule] + `\n\nText des Nutzers: "${text}"` }]
      })
    });
    const data = await response.json();
    const raw = data.content.map(i => i.text || '').join('');
    parsedEntry = JSON.parse(raw.replace(/```json|```/g, '').trim());
    document.getElementById('transcriptText').textContent = parsedEntry.transkript || text;
    showParsedEntry();
  } catch(e) {
    showStatus('Fehler beim Analysieren.', 'error');
  }
}

function showParsedEntry() {
  hideStatus();
  if (parsedEntry.transkript && !document.getElementById('manualInput')) {
    document.getElementById('transcriptCard').classList.add('visible');
    document.getElementById('transcriptText').textContent = parsedEntry.transkript;
  }

  const LABELS = {
    schlaf: [['Einschlafzeit', parsedEntry.einschlafzeit], ['Aufwachzeit', parsedEntry.aufwachzeit], ['Schlafqualität', (parsedEntry.schlaf_quality || '—') + ' / 10'], ['Regelmäßigkeit', parsedEntry.regularity]],
    fitness: [['Workout', parsedEntry.workout_typ], ['Dauer', (parsedEntry.dauer_min || '—') + ' min'], ['Intensität', (parsedEntry.intensitaet || '—') + ' / 10'], ['Übungen', parsedEntry.uebungen]],
    ernaehrung: [['Kalorien', (parsedEntry.kalorien || '—') + ' kcal'], ['Protein', (parsedEntry.protein_g || '—') + ' g'], ['Wasser', (parsedEntry.wasser_ml || '—') + ' ml'], ['Mahlzeiten', parsedEntry.mahlzeiten]],
    mindfulness: [['Stimmung', (parsedEntry.stimmung || '—') + ' / 10'], ['Energie', (parsedEntry.energie || '—') + ' / 10'], ['Stress', (parsedEntry.stress || '—') + ' / 10'], ['Bildschirmzeit', (parsedEntry.bildschirmzeit_h || '—') + ' h'], ['Journaling', parsedEntry.journaling ? 'Ja ✓' : 'Nein']]
  };

  document.getElementById('previewRows').innerHTML = (LABELS[currentModule] || []).map(([k, v]) => `
    <div class="preview-row"><span class="preview-key">${k}</span><span class="preview-val">${v || '—'}</span></div>
  `).join('');

  document.getElementById('previewCard').classList.add('visible');
  document.getElementById('actionsCard').classList.add('visible');
  document.getElementById('recordLabel').textContent = 'Tippen zum Aufnehmen';
}

async function saveToNotion() {
  if (!parsedEntry) return;
  showStatus('<span class="spinner"></span>Speichere in Notion…', 'loading');
  document.getElementById('actionsCard').classList.remove('visible');

  const today = new Date().toISOString().split('T')[0];
  let properties = { 'Name': { title: [{ text: { content: today } }] } };

  if (currentModule === 'schlaf') {
    const wakeDate = (parsedEntry.aufwachzeit < parsedEntry.einschlafzeit)
      ? new Date(Date.now() + 86400000).toISOString().split('T')[0] : today;
    if (parsedEntry.einschlafzeit) properties['Einschlafzeit'] = { date: { start: `${today}T${parsedEntry.einschlafzeit}:00` } };
    if (parsedEntry.aufwachzeit)   properties['Aufwachzeit']   = { date: { start: `${wakeDate}T${parsedEntry.aufwachzeit}:00` } };
    if (parsedEntry.schlaf_quality) properties['Schlaf Quality'] = { number: Number(parsedEntry.schlaf_quality) };
    if (parsedEntry.regularity)    properties['Regularity']   = { select: { name: parsedEntry.regularity } };
    properties['Datum'] = { date: { start: today } };
  }

  try {
    const response = await fetch('https://api.notion.com/v1/pages', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${NOTION_TOKEN}`, 'Content-Type': 'application/json', 'Notion-Version': '2022-06-28' },
      body: JSON.stringify({ parent: { database_id: BACKEND_DB_ID }, properties })
    });
    const data = await response.json();
    if (response.ok) {
      showStatus('✓ Eintrag gespeichert', 'success');
      addToHistory();
      setTimeout(resetAll, 2000);
    } else {
      showStatus('Fehler: ' + (data.message || 'Unbekannt'), 'error');
      document.getElementById('actionsCard').classList.add('visible');
    }
  } catch(e) {
    showStatus('Verbindungsfehler', 'error');
    document.getElementById('actionsCard').classList.add('visible');
  }
}

function addToHistory() {
  const NAMES = { schlaf: '🌙 Schlaf', fitness: '💪 Fitness', ernaehrung: '🥗 Ernährung', mindfulness: '🧘 Psyche' };
  const SUMS = {
    schlaf: `${parsedEntry.einschlafzeit} → ${parsedEntry.aufwachzeit} · Q ${parsedEntry.schlaf_quality}/10`,
    fitness: `${parsedEntry.workout_typ} · ${parsedEntry.dauer_min} min`,
    ernaehrung: `${parsedEntry.kalorien} kcal · ${parsedEntry.protein_g}g Protein`,
    mindfulness: `Stimmung ${parsedEntry.stimmung}/10 · Energie ${parsedEntry.energie}/10`
  };
  sessionHistory.unshift({ module: NAMES[currentModule], summary: SUMS[currentModule], time: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) });
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (!sessionHistory.length) { list.innerHTML = '<div class="empty">Noch keine Einträge</div>'; return; }
  list.innerHTML = sessionHistory.map(h => `
    <div class="history-item">
      <div class="history-left">
        <span class="history-module">${h.module}</span>
        <span class="history-summary">${h.summary}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="history-time">${h.time}</span>
        <div class="dot-success"></div>
      </div>
    </div>
  `).join('');
}

function showStatus(msg, type) {
  const el = document.getElementById('statusCard');
  el.innerHTML = msg;
  el.className = 'glass status-card visible ' + type;
}

function hideStatus() { document.getElementById('statusCard').className = 'glass status-card'; }

function resetAll() {
  parsedEntry = null;
  document.getElementById('transcriptCard').classList.remove('visible');
  document.getElementById('previewCard').classList.remove('visible');
  document.getElementById('actionsCard').classList.remove('visible');
  document.getElementById('recordLabel').textContent = 'Tippen zum Aufnehmen';
  hideStatus();
}
</script>
</body>
</html>
